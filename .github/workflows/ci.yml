name: BiblioTech CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  POSTGRES_DB: bibliotech_test
  POSTGRES_USER: bibliotech
  POSTGRES_PASSWORD: secret

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Tests backend (PHPUnit)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend — PHPUnit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: dev/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, mbstring, ctype, iconv
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: dev/backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('dev/backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate JWT RSA keypair (test only)
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out config/jwt/private.pem \
            -pass pass:change_me_jwt_passphrase 2>/dev/null
          openssl pkey -in config/jwt/private.pem \
            -out config/jwt/public.pem \
            -pubout \
            -passin pass:change_me_jwt_passphrase 2>/dev/null

      - name: Set up test environment
        run: |
          cp .env.test .env.test.local
          echo "DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.POSTGRES_DB }}?serverVersion=16&charset=utf8" >> .env.test.local

      - name: Create database & run migrations
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Load fixtures
        env:
          APP_ENV: test
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Run PHPUnit tests
        env:
          APP_ENV: test
        run: php bin/phpunit --testdox

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — Lint frontend (ESLint + TypeScript)
# ──────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — TypeScript check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dev/frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build Docker images (sur tags de release uniquement)
# ──────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: dev/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliotech-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliotech-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: dev/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliotech-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliotech-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
